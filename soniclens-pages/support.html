    const LANG_ORDER = ["ja", "en", "es", "zh", "fr"];

    function detectLang() {
      const params = new URLSearchParams(location.search);
      const q = (params.get("lang") || params.get("hl") || "").toLowerCase();
      if (q) {
        if (q.startsWith("zh")) return "zh";
        if (q.startsWith("es")) return "es";
        if (q.startsWith("fr")) return "fr";
        if (q.startsWith("en")) return "en";
        if (q.startsWith("ja")) return "ja";
      }
      const nav = (navigator.language || "ja").toLowerCase();
      if (nav.startsWith("zh")) return "zh";
      if (nav.startsWith("es")) return "es";
      if (nav.startsWith("fr")) return "fr";
      if (nav.startsWith("en")) return "en";
      return "ja";
    }

    function applyLang(lang) {
      const t = I18N[lang] || I18N.ja;
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
      document.title = t.pageTitle;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key === "onDevice") {
          const span = el.querySelector("span");
          if (span) span.textContent = t.onDevice;
          return;
        }
        if (t[key] != null) el.textContent = t[key];
      });

      const faqList = document.getElementById("faqList");
      faqList.innerHTML = "";
      t.faq.forEach((item) => {
        const wrap = document.createElement("article");
        wrap.className = "faq-item";
        const q = document.createElement("h3");
        q.className = "faq-q";
        q.textContent = item.q;
        const a = document.createElement("p");
        a.className = "faq-a";
        a.textContent = item.a;
        wrap.appendChild(q);
        wrap.appendChild(a);
        faqList.appendChild(wrap);
      });

      const year = String(new Date().getFullYear());
      document.getElementById("footerCopy").textContent = t.footerCopy
        .replace("{year}", year)
        .replace("{updated}", LAST_UPDATED);

      const mail = document.getElementById("mailLink");
      mail.href =
        "mailto:" +
        CONTACT_EMAIL +
        "?subject=" +
        encodeURIComponent(t.mailSubject);

      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });

      try {
        localStorage.setItem("soniclens-lang", lang);
      } catch (_) {}
    }

    function init() {
      const stored = (() => {
        try {
          return localStorage.getItem("soniclens-lang");
        } catch (_) {
          return null;
        }
      })();
      const lang = stored && I18N[stored] ? stored : detectLang();
      applyLang(lang);

      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.addEventListener("click", () => applyLang(btn.dataset.lang));
      });
    }

    init();
  </script>
